services:
  postgres:
    image: postgres:16
    container_name: academia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: academia
      POSTGRES_DB: academia
    ports:
      - "5432:5432"
    volumes:
      - academia-postgres-data:/var/lib/postgresql/data
      - ./postgres/academia.sql:/docker-entrypoint-initdb.d/academia.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  academia-postgres-data:
