services:
  mysql:
    image: mysql:8.0
    container_name: academia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: academia
      MYSQL_DATABASE: Academia
    ports:
      - "3306:3306"
    volumes:
      - academia-mysql-data:/var/lib/mysql
      - ./mysql/academia.sql:/docker-entrypoint-initdb.d/academia.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  academia-mysql-data:
